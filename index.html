<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<meta name="robots" content="noindex, nofollow">
<title>施術ログ@</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Noto Sans JP",sans-serif;--ink:#12273d;--muted:#4c647a;--line:#d8e3ec;--surface:white;--blue:#0c53a6;--navy:#10243a;--teal:#00786a;--wash:#edf3f8;--red:#a92739}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-size:16px;line-height:1.55}button,input,select,textarea{font:inherit;color:inherit}button,input,select,textarea,summary{touch-action:manipulation}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #2583dc;outline-offset:2px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.35rem,4.8vw,2.15rem);letter-spacing:-.035em;line-height:1.22}h2{font-size:1.25rem}h3{font-size:1.05rem}small,.sub{font-size:.875rem;color:var(--muted)}p+p{margin-top:.55rem}
.top{background:var(--navy);color:white}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:18px}.wrap{max-width:1152px;margin:auto;padding-inline:clamp(12px,3vw,28px)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{border-radius:10px;width:44px;height:44px;object-fit:contain;flex:none}.top small{color:#c7d8e8}.top button{background:#203c58;color:white;border-color:#557087}.top .mode{font-size:.82rem;white-space:nowrap}
nav{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}nav .wrap{display:flex;gap:5px}nav button{border:0;border-radius:0;background:white;color:var(--muted);border-bottom:3px solid transparent;padding-inline:16px;white-space:nowrap}nav button[aria-current]{color:var(--blue);background:#eaf3ff;border-color:var(--blue);font-weight:750}
main{padding-block:24px 45px}.stack{display:grid;gap:14px}.split,.charts,.tiles{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.panel{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:clamp(13px,2vw,22px);box-shadow:0 3px 12px #10243a09}.panel>*+*{margin-top:12px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.between{justify-content:space-between}.page-title{margin-bottom:2px}#selectedDayTitle{scroll-margin-top:60px}.page-title p{margin-top:3px}.metric{background:#f1f6fc;border-radius:10px;padding:10px 12px;min-width:0}.metric strong{display:block;font-size:clamp(1rem,3.5vw,1.5rem);line-height:1.32;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.positive{color:var(--teal)}.pill{border-radius:999px;background:#e8f2ff;color:#104f94;font-size:.8rem;font-weight:700;padding:3px 9px;display:inline-block}.pill.off{background:#eef0f3;color:#47596a}.pill.done{background:#ddf4ed;color:#075c51}.pill.store{background:#fff1db;color:#684411}
button{background:#fff;border:1px solid #afc1d1;border-radius:9px;min-height:44px;padding:7px 12px;font-weight:680}button.primary{background:#0c53a6;color:#fff;border-color:#0c53a6}button.danger{color:var(--red);border-color:#e1a9b1}button.compact{padding-inline:8px}button:hover:not(:disabled){filter:brightness(.96)}
label.field{display:grid;gap:4px;align-content:start;font-size:.9rem;font-weight:680;min-width:0}input:not([type=checkbox]),select,textarea{display:block;width:100%;min-width:0;max-width:100%;min-height:44px;border:1px solid #afc1d1;border-radius:8px;background:white;padding:7px 9px;font-size:16px}textarea{resize:vertical}input[type=date],input[type=time],input[type=month]{padding-inline:6px}fieldset{margin:0;padding:0;border:0;min-width:0}legend{font-weight:700;margin-bottom:5px}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.banner{padding:12px 14px;border-radius:10px;background:#fff2d7;color:#5c410a;border:1px solid #e9c983}.note{background:#edf5ff;border-left:4px solid #3181cc;padding:9px 12px;border-radius:4px;color:#25496c;font-size:.9rem}.error{color:var(--red);font-weight:700}.empty{color:var(--muted);background:#f4f7fa;border-radius:8px;padding:10px;font-size:.9rem}.cal-layout{grid-template-columns:minmax(0,1.43fr) minmax(0,1fr);align-items:start}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;font-size:.85rem;color:var(--muted);font-weight:700}.day{position:relative;min-height:62px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:3px 1px;border-color:#dce6ef;font-variant-numeric:tabular-nums}.day[aria-pressed=true]{border:2px solid var(--blue);background:#e8f2ff;color:#08488d}.day.today:not([aria-pressed=true]){box-shadow:inset 0 0 0 1px #6396c9}.dots{display:flex;justify-content:center;gap:2px;min-height:6px}.dot{height:6px;width:6px;border-radius:20px;background:#347ccc}.dot.done{background:#088575}.dot.off{background:#77899b}.dot.store{background:#bf7b13}.legend{display:flex;gap:10px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:4px}.record{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}.record>*+*{margin-top:7px}.record strong{overflow-wrap:anywhere}.entries{display:grid;gap:10px}
.analysis-hero{background:linear-gradient(118deg,#10243a,#174c68);border:0;color:white}.analysis-hero h2{font-size:1.5rem}.analysis-hero .sub{color:#d1e0ec}.analysis-hero .metric{background:#ffffff13;border:1px solid #ffffff36}.analysis-hero .metric .sub{color:#e1eef7}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:2.2rem minmax(0,1fr) minmax(4.7rem,auto);gap:6px;align-items:center;font-size:.86rem}.bar b{text-align:right;font-variant-numeric:tabular-nums}.track{height:9px;border-radius:20px;background:#e8eff6;overflow:hidden}.fill{height:100%;background:#1768b8;border-radius:20px}.fill.teal{background:#007e70}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.87rem;font-variant-numeric:tabular-nums}th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f2f6fa}td.num,th.num{text-align:right;white-space:nowrap}ol,ul{margin-block:8px;padding-left:1.5rem}li+li{margin-top:6px}.rank li::marker{color:#0c53a6;font-weight:750}.local-status{font-size:.84rem;margin-top:12px;color:var(--muted)}#toast:not(:empty){position:fixed;bottom:80px;right:12px;z-index:8;max-width:calc(100% - 24px);background:#10243a;color:white;padding:10px 15px;border-radius:9px;box-shadow:0 2px 12px #12273d55;pointer-events:none}
dialog{width:min(640px,calc(100% - 24px));max-height:calc(100dvh - 30px);padding:0;border:1px solid var(--line);border-radius:15px;color:var(--ink)}dialog::backdrop{background:#0c2136aa}.dialog-head,.dialog-foot{position:sticky;background:white;z-index:1;padding:10px 15px}.dialog-head{top:0;border-bottom:1px solid var(--line)}.dialog-foot{bottom:0;border-top:1px solid var(--line)}.dialog-body{padding:15px}.check{display:inline-flex;align-items:center;gap:4px;padding:6px;min-height:44px;border:1px solid var(--line);border-radius:8px}input[type=checkbox]{width:18px;height:18px}summary{cursor:pointer;font-weight:720;min-height:44px;padding:9px 0}details[open]>summary{margin-bottom:5px}.hours{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.detail-list{display:grid;gap:8px}
@media(max-width:760px){.top .wrap{padding-block:12px}.top .wrap,.brand{gap:8px}.top button{font-size:.8rem;padding-inline:7px}.top h1{font-size:clamp(1rem,4.4vw,1.55rem)}.brand-mark{width:34px;height:34px}.cal-layout,.charts,.settings-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:48px}main{padding-block:14px calc(88px + env(safe-area-inset-bottom))}nav{position:fixed;top:auto;bottom:0;left:0;width:100%;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 14px #10243a15}nav .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-inline:4px;gap:1px}nav button{padding:5px 1px;font-size:.86rem;min-height:58px;border-bottom:0;border-top:3px solid transparent}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:380px){.split:not(.cal-layout){gap:8px}.panel{padding:11px}.cal{gap:2px}.dot{width:5px;height:5px}th,td{padding:6px}}
.analysis-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px}
.analysis-switch button{min-height:44px;border-color:transparent}.analysis-switch button[aria-pressed="true"]{background:var(--blue);color:#fff}
.metric .metric-note{display:block;margin-top:5px;color:var(--muted);font-size:.85rem}.hourly-metrics .metric{display:flex;flex-direction:column}.hourly-metrics .metric strong{margin-top:auto;padding-top:4px}
.pay-lines{margin:0}.pay-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.pay-line dd{margin:0;text-align:right;font-weight:730;font-variant-numeric:tabular-nums;white-space:nowrap}.pay-line.deduction dd{color:var(--red)}.pay-line.total{font-weight:750;border-bottom:0}.pay-line.total dd{color:var(--blue);font-size:1.2rem}
.page-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.page-title-row .page-title{min-width:0}
.ad-slot{display:flex;align-items:center;justify-content:center;min-width:0;border:1px dashed var(--line);border-radius:8px;background:#f9fafc;color:var(--muted);font-size:.75rem}
.ad-slot--analysis{flex:0 1 72px;min-height:30px;padding:3px 5px}
.ad-slot--export{width:100%;min-height:68px;padding:8px}
.hourly-label{margin-top:12px}
.pay-line.subtotal{font-weight:700}
</style>

<template id="guide"><details><summary>使い方・試作の制限</summary><div class="stack">
<p class="note">GalaxyではHTMLをダウンロードし、「マイファイル」のダウンロードから開きます。アプリを選べる場合はブラウザを選択します。同じブラウザ・同じファイルで開き直してください。</p>
<ol><li>右上の「サンプルを試す」で、架空の2店舗・2か月分の入力と分析を確認できます。「実データに戻る」で自分の記録に切り替わります。</li><li>設定で店舗名、対象月の施設利用料率、指名料・控除を設定します。</li><li>カレンダーの日付を選び、出勤予定・勤務実績・施術・店舗データを登録します。休日は予定と実績にそれぞれ登録できます。各フォームの保存・削除はその場で端末内に反映されます。</li><li>分析で対象日、期間、店舗を選びます。データ出力で同じ条件のCSVを保存できます。設定でJSONバックアップを作成・復元できます。</li></ol>
<p class="note">勤務は同じ日・店舗につき予定と実績が各1枠。日またぎは出勤日で集計します。待機時間は勤務時間（休憩を除く）から施術時間を引いた目安です。施術未入力の出勤日は、稼働率・待機の集計対象外です。施術ゼロの日は基本入力で0を保存してください。</p>
<p class="note">時間帯の分析は詳細入力の来店時刻と手入力した店舗の時間帯別来店客数を集計します。勤務時間帯の提案は来店が記録された時間帯の傾向を表示します。設定変更は過去の報酬目安にも反映されます。</p>
<p class="note">端末間の同期、予約連携、既存の施術ログからの取込は対象外です。ブラウザやHTMLファイルの置き場所を変えると保存済みデータを読み込めない場合があります。移動前にJSONを保存してください。自由メモにはお客様を特定できる情報を入力しないでください。CSVには自由メモを含めません。</p>
</div></details>
<details><summary>Ver.1.1の追加機能</summary><div class="stack">
<p>来店・出勤・退勤時刻は「1430」のように入力すると「14:30」になります。来店時刻は空欄でも保存できます。オプションは設定で追加し、施術の詳細入力で複数選べます。</p>
<p>オプションの名前・金額は施術ごとに保存します。集計は分析の「オプション販売」と勤務CSVで確認できます。店舗売上・来店客数は確認できたものだけ入力できます。</p>
<p>旧試作のJSONを復元できます。旧版の報酬率は100%から引いて施設利用料率に換算します。</p>
</div></details>
<details><summary>Ver.1.3の変更</summary><p>時間あたりの報酬は施術分で計算し、指名とオプションは報酬の内訳に表示します。稼働率は施術と勤務の合計時間から計算します。</p></details>
<details><summary>Ver.1.2の変更</summary><p>分析ページ上部で「自分の分析」と「店舗分析」を切り替えられます。勤務の指標は控除前の金額を主表示にし、控除後の金額も表示します。</p></details>
<details><summary>試用後の改善チェックリスト</summary><div class="stack"><ul>
<li>スマホで勤務を1日分入力・修正するまで、何秒かかった？ 迷った項目は？</li>
<li>基本入力と詳細入力のどちらを普段使いしたい？ 併用したい場面は？</li>
<li>施術売上・基本料金・報酬目安の違いが画面から伝わる？ 精算明細との差は？</li>

function saveEditor(event) {
  event.preventDefault();
  const {type,store,layer,date,key,record}=editing;
  const form=event.currentTarget, v=fromForm(form), next=clone(data());
  const shift = () => v.status==='off' ? {status:'off'} : {status:'work',start:v.start,end:v.end,breaks:Number(v.breaks)};
  let message='保存しました';
  try {
    if (type==='shift') {
      next.shifts[key] ??= {date,store};
      next.shifts[key][layer]=shift();
    } else if (type==='visit') {
      let visit = {date,store,mode:v.mode};
      if (v.mode==='basic') {
        visit.basic=Object.fromEntries(['minutes','count','personal','gender','sales'].map(field=>[field,Number(v[field])]));
      } else {
        visit.details=[...form.querySelectorAll('.detail-entry')].map(row=>{
          const value=name=>row.querySelector('[name="'+name+'Detail"]').value;
          const options=[...row.querySelectorAll('[data-option]:checked')].map(checkbox=>JSON.parse(checkbox.dataset.option));
          const detail={minutes:Number(value('minutes')),sales:Number(value('sales')),kind:value('kind'),time:value('time'),memo:value('memo')};
          if (options.length) detail.options=options;
          return detail;
        });
        check(visit.details.length>0,'施術を1件以上追加してください。施術がゼロの場合は基本入力で記録できます。');
      }
      if (record && record.mode!==visit.mode) {
        const warning=visit.mode==='basic'
          ? '基本入力に切り替えると、施術ごとの来店時刻・オプションなどの詳細記録が消えます。切り替えますか？'
          : '入力方法を切り替えます。以前の入力内容を今回の内容に置き換えますか？';
        if (!confirm(warning)) return;
      }
      next.visits[key]=visit;
    } else if (type==='traffic') {
      const entries=hours.flatMap(h=>v['hour'+h]===''?[]:[[h,Number(v['hour'+h])]]);
      next.traffic[key]={date,store,total:optionalNumber(v.total),staff:optionalNumber(v.staff),sales:optionalNumber(v.storeSales),hours:Object.fromEntries(entries)};
    } else {
      const picks = new FormData(form).getAll('weekday').map(Number);
      check(picks.length>0,'曜日を1つ以上選択してください。');
      check(validDate(v.from) && validDate(v.until) && v.from<=v.until &&
        (+dateOf(v.until)- +dateOf(v.from))/86400000 <366,'開始日・終了日を366日以内に設定してください。');
      let added=0, skipped=0;
      for (let day=v.from;day<=v.until;day=offset(day,1)) {
        if (!picks.includes(weekday(day))) continue;
        const target=keyFor(day,v.store);
        next.shifts[target]??={date:day,store:v.store};
        if (next.shifts[target].plan) {skipped++;continue;}
        next.shifts[target].plan=shift();
        added++;
      }
      check(added+skipped>0,'指定期間に選んだ曜日がありません。');
      message='予定を'+added+'日登録、既存の予定'+skipped+'日をスキップしました';
    }
    commit(next);
    $('editor').close();
    render();
    $('selectedDayTitle')?.focus();
    notify(message);
  } catch (error) { showFormError(error.message); }
}
function showFormError(message) {

function removeRecord() {

  } else {

  }
  try {
    commit(next); $('editor').close(); render(); $('selectedDayTitle')?.focus(); notify('削除しました');
  } catch (error) { showFormError(error.message); }
}

function bounds() {
  const {kind,anchor,start,end}=filter, period=anchor.slice(0,7);
  if (kind==='custom') return [start,end];
  if (kind==='year') return [period.slice(0,4)+'-01-01',period.slice(0,4)+'-12-31'];
  if (kind==='week') {
    const monday=offset(anchor,-((weekday(anchor)+6)%7));
    return [monday,offset(monday,6)];
  }
  return [period+'-01',monthEnd(period)];
}

function rowsBetween(from,until,store='') {
  const d=data(), keys=[...new Set([...Object.keys(d.shifts),...Object.keys(d.visits),...Object.keys(d.traffic)])].sort();
  return keys.flatMap(key=>{
    const record=d.shifts[key] ?? d.visits[key] ?? d.traffic[key], {date,store:storeId}=record;
    if (date<from || date>until || (store && store!==storeId)) return [];
    const plan=d.shifts[key]?.plan, actual=d.shifts[key]?.actual, visit=d.visits[key], traffic=d.traffic[key];
    const totals=visit?summary(visit):null;
    const work=actual?.status==='work'?netMinutes(actual):null;
    const waiting=work!=null && totals ? work-totals.minutes : null;
    const breakdown=payBreakdown(totals,date,d.settings);
    return [{date,store:storeId,dow:weekday(date),plan,actual,visit,traffic,totals,work,waiting,
      breakdown,pay:breakdown?.net??null}];
  });
}
function hourlyTreatment(rows,minutes,amount) {
  return ratio(sum(rows,r=>r.breakdown[amount])*60,sum(rows,minutes));
}
function summarize(rows) {
  const shifts=rows.filter(r=>r.work!=null), known=rows.filter(r=>r.totals), paid=known.filter(r=>r.pay!=null);
  const paired=shifts.filter(r=>r.totals), pairedPaid=paired.filter(r=>r.pay!=null);
  const workDates=new Set(shifts.map(r=>r.date));
  const minutes=known.length?sum(known,r=>r.totals.minutes):null, work=shifts.length?sum(shifts,r=>r.work):null;
  const waiting=paired.length?sum(paired,r=>r.waiting):null;
  const count=known.length?sum(known,r=>r.totals.count):null, personal=sum(known,r=>r.totals.personal), gender=sum(known,r=>r.totals.gender);
  const pay=paid.length?sum(paid,r=>r.pay):null;
  return {shifts,known,paid,paired,pairedPaid,workDates,minutes,work,waiting,count,personal,gender,
    free:count==null?null:count-personal-gender, nomination:ratio(personal,count), pay,
    utilization:ratio(sum(paired,r=>r.totals.minutes),sum(paired,r=>r.work)),
    averageWaiting:mean(paired,r=>r.waiting),
    perTreatment:hourlyTreatment(paid,r=>r.totals.minutes,'treatmentNet'),
    grossPerTreatment:hourlyTreatment(paid,r=>r.totals.minutes,'treatment'),
    grossPerWork:hourlyTreatment(pairedPaid,r=>r.work,'treatment'),
    perWork:hourlyTreatment(pairedPaid,r=>r.work,'treatmentNet'),
    sales:known.length?sum(known,r=>r.totals.sales):null,
    missingPay:known.length-paid.length, missingVisits:shifts.length-paired.length,
    missingShifts:known.filter(r=>r.totals.count>0 && r.work===null).length};
}

function correlation(pairs) {
  if (pairs.length<3) return null;
  const x=mean(pairs,p=>p[0]), y=mean(pairs,p=>p[1]);
  const divisor=Math.sqrt(sum(pairs,p=>(p[0]-x)**2)*sum(pairs,p=>(p[1]-y)**2));
  return divisor ? sum(pairs,p=>(p[0]-x)*(p[1]-y))/divisor : null;
}
function hourly(rows) {
  const bins=hours.map(hour=>({hour,free:0,personal:0,gender:0,customers:0,trafficCount:0,shiftMinutes:0,coverage:0,observed:0}));
  let missing=0;
  for (const row of rows) {
    for (const [h,value] of Object.entries(row.traffic?.hours??{})) {
      bins[h].customers+=value;
      bins[h].trafficCount++;
    }
    const timed=row.visit?.mode==='detail' ? row.visit.details.filter(v=>v.time) : [];
    missing+=(row.totals?.count??0)-timed.length;
    for (const item of timed) bins[Math.floor(minuteOf(item.time)/60)][item.kind]++;
    if (row.work==null) continue;
    const complete=row.totals && timed.length===row.totals.count;
    const intervals=clockIntervals(row.actual);
    for (const bin of bins) {
      const overlap=sum(intervals,([start,end])=>Math.max(0,Math.min(end,(bin.hour+1)*60)-Math.max(start,bin.hour*60)));
      bin.shiftMinutes+=overlap;
      if (!complete) continue;
      bin.coverage+=overlap;
      for (const item of timed) {
        const minute=minuteOf(item.time);
        if (Math.floor(minute/60)===bin.hour && intervals.some(([start,end])=>start<=minute && minute<end)) bin.observed++;
      }
    }
  }
  return {bins,missing};
}
function proposals(rows,total,{bins}) {
  const groups=[1,2,3,4,5,6,0].map(i=>{
    const list=rows.filter(r=>r.dow===i), s=summarize(list);
    return {label:days[i]+'曜',...s};
  });
  const rank=(name,val,count,fmt,low=false)=>{
    const best=groups.filter(g=>g[val]!=null && count(g)>=2)
      .sort((a,b)=>low?a[val]-b[val]:b[val]-a[val]).slice(0,3);
    return '<li><strong>'+name+'</strong>　'+(best.length?best.map(g=>g.label+' '+fmt(g[val])+'（'+count(g)+'枠）').join(' ／ ')
      :'各曜日で対象の記録が2枠以上必要です。')+'</li>';
  };
  const bestHours=bins.filter(b=>b.coverage>=120 && b.observed>0)
    .sort((a,b)=>b.observed/b.coverage-a.observed/a.coverage).slice(0,3);
  const fullDates=[...total.workDates].filter(date=>rows.filter(r=>r.date===date&&(r.work!=null || (r.totals?.count??0)>0))
    .every(r=>r.work!=null&&r.pay!=null));
  const daily=mean(fullDates,date=>sum(total.pairedPaid.filter(r=>r.date===date),r=>r.pay));
  const target=data().settings.target;
  return '<ol class="rank">'+rank('稼働率が高い曜日','utilization',g=>g.paired.length,pct)+
    rank('平均待機が短い曜日','averageWaiting',g=>g.paired.length,duration,true)+
    rank('出勤1時間あたりの施術報酬が高い曜日（控除後）','perWork',g=>g.pairedPaid.length,yen)+
    rank('個人指名率が高い曜日','nomination',g=>g.known.filter(r=>r.totals.count>0).length,pct)+
    '<li><strong>来店が入りやすかった勤務時間帯</strong>　'+(bestHours.length?bestHours.map(b=>hourLabel(b.hour)+' '+(b.observed*60/b.coverage).toFixed(1)+'件/h（勤務'+duration(b.coverage)+'）').join(' ／ ')
      :'勤務実績と全件の来店時刻がそろった枠が必要です。各時間帯の勤務が合計2時間以上で表示します。')+'</li>'+
    '<li><strong>目標報酬までの勤務日数</strong>　'+(!target?'設定で目標月間報酬を入力してください。':
      fullDates.length<2 || !(daily>0)?'報酬を計算できる勤務日が2日以上あり、平均報酬が正の場合に表示します。':
      '目標 '+yen(target)+' ÷ 1日平均 '+yen(daily)+' ＝ 約<strong>'+format(Math.ceil(target/daily))+'日</strong>（'+fullDates.length+'日分）')+
    '</li></ol><p class="sub">選択期間の実績に基づく参考情報です。時間帯は勤務枠内の来店回数を勤務時間で割った値です。時間帯ごとの休憩時刻は集計していません。将来の売上・報酬を保証するものではありません。</p>';
}
function analysis() {
  const [from,until]=bounds(), rows=rowsBetween(from,until,filter.store), timing=hourly(rows);
  const switcher='<div class="analysis-switch" role="group" aria-label="分析の切り替え">'+
    [['personal','自分の分析'],['store','店舗分析']].map(([value,label])=>
      '<button type="button" data-analysis-view="'+value+'" aria-pressed="'+(analysisView===value)+'">'+label+'</button>').join('')+'</div>';
  const header='<div class="page-title-row">'+setHeading('分析','期間と店舗で絞り込み')+adSlot('analysis')+'</div>'+switcher+filterPanel();
  if (analysisView==='store') return header+storeAnalysis(rows,timing);
  const total=summarize(rows), worked=total.workDates.size;
  const baseline=total.minutes==null?null:total.minutes/60*data().settings.base;
  const hero='<section class="panel analysis-hero"><h2>自分の集計</h2><div class="tiles">'+
    metric('報酬目安（控除後）',netPayText(total))+metric('施術売上',yen(total.sales))+
    metric('出勤日数・勤務時間',worked+'日 ／ '+duration(total.work))+metric('施術時間・件数',duration(total.minutes)+' ／ '+qty(total.count))+
    '</div></section>';
  const hourlyPay=(title,before,after,missing)=>'<div class="metric"><span class="sub">'+title+'</span>'+
    '<strong>'+configuredYen(before,missing)+'</strong><span class="metric-note">控除後 '+configuredYen(after,missing)+'</span></div>';
  const work=panel('勤務の指標','<div class="tiles">'+metric('稼働率',pct(total.utilization))+
    metric('待機時間',duration(total.waiting))+'</div><h3 class="hourly-label">時間あたりの施術報酬</h3><div class="split hourly-metrics">'+
    hourlyPay('施術1時間あたり',total.grossPerTreatment,total.perTreatment,total.missingPay>0)+
    hourlyPay('出勤1時間あたり',total.grossPerWork,total.perWork,total.paired.length>total.pairedPaid.length)+
    '</div><details><summary>計算方法について</summary>'+
    '<p class="sub">施術売上から月別の施設利用料率を一度だけ差し引きます。控除後はさらに施設利用料と固定材料費を施術分数に応じて引きます。指名・オプション報酬とその他控除は最終の報酬目安に反映します。</p>'+
    '<p class="sub">施術1時間あたりは施術報酬を合計施術時間で割ります。出勤1時間あたりと稼働率は、施術と勤務の実績が同じ日・店舗にそろった枠を集計します。施術0件を記録した日は勤務時間を含め、未入力は集計から外します。稼働率は合計施術時間 ÷ 合計勤務時間です。</p>'+
    '<p class="sub">基本料金の換算額 '+yen(baseline)+' ／ 施術未入力の勤務 '+total.missingVisits+'枠 ／ 勤務実績のない施術 '+total.missingShifts+
    '枠 ／ 施設利用料率未設定の施術 '+total.missingPay+'枠</p></details>');
  const workCharts='<div class="charts">'+panel('曜日別の施術時間',bars(groupWeek(rows,g=>summarize(g).minutes),duration))+
    panel('曜日別の稼働率',bars(groupWeek(rows,g=>summarize(g).utilization),pct,'teal'))+'</div>';
  const nominationRows=groupWeek(rows,g=>summarize(g)).map(({label,value:v})=>tr(cell(label)+ncell(qty(v.free))+
    ncell(qty(v.count==null?null:v.personal))+ncell(qty(v.count==null?null:v.gender))+ncell(pct(v.nomination)))).join('');
  const nomination=panel('指名分析','<div class="tiles">'+metric('フリー',qty(total.free))+metric('個人指名',qty(total.count==null?null:total.personal))+
    metric('性別指名',qty(total.count==null?null:total.gender))+metric('個人指名率',pct(total.nomination))+'</div>'+
    '<div class="charts"><section><h3>曜日別</h3>'+table(['曜日','フリー','個人','性別','個人率'],nominationRows)+'</section>'+
    '<section><h3>来店時間帯別</h3>'+
    (timing.bins.some(b=>b.free+b.personal+b.gender)?table(['時間帯','フリー','個人','性別','個人率'],timing.bins.filter(b=>b.free+b.personal+b.gender)
      .map(b=>tr(cell(hourLabel(b.hour))+ncell(qty(b.free))+ncell(qty(b.personal))+ncell(qty(b.gender))+ncell(pct(ratio(b.personal,b.free+b.personal+b.gender))))).join('')):empty('来店時刻のある詳細記録がありません。'))+
    '<p class="sub">来店時刻のない施術 '+timing.missing+'件を除外。</p></section></div>');
  const workHours=timing.bins.filter(b=>b.shiftMinutes>0 || b.free+b.personal+b.gender>0);
  const workByHour=panel('時間帯別の勤務傾向',workHours.length?
    table(['時間帯','勤務枠の合計','時刻付き施術'],workHours.map(b=>
      tr(cell(hourLabel(b.hour))+ncell(duration(b.shiftMinutes||null))+ncell(qty(b.free+b.personal+b.gender||null)))).join(''))+
    '<p class="sub">勤務枠の合計は出勤から退勤まで。休憩の開始・終了時刻は集計対象外です。</p>':
    empty('勤務枠や来店時刻の記録がありません。'));
  const current=(filter.kind==='custom'?filter.end:filter.anchor).slice(0,7), prev=monthOffset(current,-1);
  const previousMonth=[prev,current].map(m=>[m,summarize(rowsBetween(m+'-01',monthEnd(m),filter.store))]);
  const periods=new Map();
  for (const row of rows) {
    const key=filter.kind==='week'?row.date:row.date.slice(0,7);
    if (!periods.has(key)) periods.set(key,[]);
    periods.get(key).push(row);
  }
  const comparisonTable=(first,periods)=>table([first,'出勤日','施術時間','施術売上','報酬目安'],periods
    .map(([key,v])=>tr(cell(esc(key))+ncell(v.workDates.size+'日')+ncell(duration(v.minutes))+ncell(yen(v.sales))+ncell(netPayText(v)))).join(''));
  const [a,b]=previousMonth.map(([,v])=>v);
  const delta = a.pay!=null && b.pay!=null && !a.missingPay && !b.missingPay && !a.missingVisits && !b.missingVisits
    ? '<p class="sub">前月からの報酬差 '+(b.pay>=a.pay?'+':'')+yen(b.pay-a.pay)+'</p>' : '<p class="sub">報酬差は両月の施術実績と報酬の計算に必要な入力がそろった場合に表示します。</p>';
  let priorComparison='';
  if (filter.kind!=='month') {
    const dayCount=(+dateOf(until)- +dateOf(from))/86400000+1;
    const priorEnd=offset(from,-1);
    const priorStart=filter.kind==='year' ? priorEnd.slice(0,4)+'-01-01' : offset(from,-dayCount);
    priorComparison='<h3>選択期間と直前の期間</h3>'+comparisonTable('期間',[
      [priorStart+' 〜 '+priorEnd,summarize(rowsBetween(priorStart,priorEnd,filter.store))],
      [from+' 〜 '+until,total]
    ]);
  }
  const ownByStore=data().stores.filter(store=>!filter.store||filter.store===store.id)
    .map(store=>[store.name,summarize(rows.filter(row=>row.store===store.id))]);
  const comparison=panel('期間比較','<h3>対象月と前月</h3>'+comparisonTable('対象月',previousMonth)+delta+priorComparison+
    '<h3>選択期間の内訳</h3>'+(periods.size?comparisonTable(filter.kind==='week'?'日付':'月',[...periods].map(([k,v])=>[k,summarize(v)])):
    empty('対象期間に記録がありません。'))+
    (ownByStore.length>1?'<details><summary>店舗別の自分の実績</summary>'+comparisonTable('店舗',ownByStore)+'</details>':''));
  return header+hero+(!rows.length?empty('対象期間の記録がありません。'):'')+
    optionAnalysis(rows)+work+payDetails(total)+workCharts+workByHour+nomination+comparison+
    panel('シフト改善提案',proposals(rows,total,timing));
}
function storeAnalysis(rows,timing) {
  const logs=rows.filter(r=>r.traffic);
  const traffic=logs.filter(r=>r.traffic.total!==null);
  const sales=logs.filter(r=>r.traffic.sales!==null);
  const staff=logs.filter(r=>r.traffic.staff!==null);
  const matched=logs.filter(r=>customerSpend(r.traffic)!==null);
  const people=n=>n==null?'—':format(n)+'人';
  const averageSpend=group=>ratio(sum(group,r=>r.traffic.sales),sum(group,r=>r.traffic.total));
  const hero='<section class="panel analysis-hero"><h2>店舗の集計</h2><div class="tiles">'+
    metric('店舗売上',yen(sales.length?sum(sales,r=>r.traffic.sales):null))+
    metric('来店人数',people(traffic.length?sum(traffic,r=>r.traffic.total):null))+
    metric('平均出勤セラピスト数',headcount(mean(staff,r=>r.traffic.staff)))+
    metric('客単価',yen(averageSpend(matched)))+'</div></section>';
  const storeCompare=data().stores.filter(s=>!filter.store||filter.store===s.id).map(s=>{
    const storeRows=logs.filter(r=>r.store===s.id);
    const arrivals=storeRows.filter(r=>r.traffic.total!==null);
    const sales=storeRows.filter(r=>r.traffic.sales!==null);
    const paired=storeRows.filter(r=>customerSpend(r.traffic)!==null);
    const spend=averageSpend(paired);
    return tr(cell(esc(s.name))+
      ncell(arrivals.length?format(sum(arrivals,r=>r.traffic.total))+'人':'—')+
      ncell(headcount(mean(storeRows.filter(r=>r.traffic.staff!==null),r=>r.traffic.staff)))+
      ncell(sales.length?yen(sum(sales,r=>r.traffic.sales))+'（'+sales.length+'日）':'—')+
      ncell(paired.length?yen(spend)+'（'+paired.length+'日）':'—'));
  }).join('');
  const visitorsCases=traffic.filter(r=>r.totals).map(r=>[r.traffic.total,r.totals.count]);
  const visitorsStaff=traffic.filter(r=>r.traffic.staff!==null).map(r=>[r.traffic.total,r.traffic.staff]);
  const relationship=(label,pairs)=>{
    const corr=correlation(pairs);
    return tr(cell(label)+ncell(pairs.length+'枠')+ncell(pairs.length?mean(pairs,p=>p[0]).toFixed(1):'—')+
      ncell(pairs.length?mean(pairs,p=>p[1]).toFixed(1):'—')+ncell(corr==null?'—':corr.toFixed(2)));
  };
  const stores=panel('店舗の傾向',
    '<div class="charts"><section><h3>曜日別来店客数（店舗・日あたり平均）</h3>'+
    bars(groupWeek(traffic,g=>mean(g,r=>r.traffic.total)),n=>n==null?'—':n.toFixed(1)+'人','teal')+'</section>'+
    '<section><h3>曜日別の平均店舗売上</h3>'+bars(groupWeek(sales,g=>mean(g,r=>r.traffic.sales)),yen)+'</section></div>'+
    '<section><h3>時間帯別来店客数</h3>'+
    (timing.bins.some(b=>b.trafficCount)?table(['時間帯','来店合計','記録枠'],timing.bins.filter(b=>b.trafficCount)
      .map(b=>tr(cell(hourLabel(b.hour))+ncell(b.customers+'人')+ncell(b.trafficCount+'枠'))).join('')):empty('時間帯別の店舗データがありません。'))+'</section>'+
    '<h3>店舗別の実績</h3>'+table(['店舗','来店合計','平均出勤人数','店舗売上','客単価'],storeCompare)+
    '<p class="sub">売上は入力済みの日だけ集計。客単価は、売上と1人以上の来店客数を両方入力した日の合計売上 ÷ 合計来店客数です。</p>'+
    '<h3>来店客数と施術・出勤人数の関係</h3>'+table(['比較項目','対象','平均来店数','比較項目の平均','相関係数'],
      relationship('自分の施術件数',visitorsCases)+relationship('出勤セラピスト人数',visitorsStaff))+
    '<p class="sub">同じ日・店舗で両項目を入力した枠を使用。相関係数は3枠以上あり、両項目にばらつきがある場合に表示します。</p>');
  return hero+(!logs.length?empty('対象期間の店舗データがありません。'):'')+stores;
}

function optionAnalysis(rows) {
  const byDay=new Map(), byMonth=new Map();
  const details=rows.filter(row=>row.visit?.mode==='detail');
  const items=details.flatMap(row=>row.totals.options);
  for (const {date,totals} of details) {
    const month=date.slice(0,7);
    if (!byDay.has(date)) byDay.set(date,[]);
    if (!byMonth.has(month)) byMonth.set(month,[]);
    byDay.get(date).push(...totals.options);
    byMonth.get(month).push(...totals.options);
  }
  const v=summarizeOptions(items);
  const breakdown=(label,records)=>table([label,'販売件数','販売金額','セラピスト報酬'],records.map(([key,value])=>
    tr(cell(esc(key))+ncell(qty(value.count))+ncell(yen(value.sales))+ncell(yen(value.pay)))).join(''));
  const periods=(label,map)=>breakdown(label,[...map].map(([key,value])=>[key,summarizeOptions(value)]));
  return panel('オプション販売','<div class="tiles">'+metric('販売件数',qty(v.count))+metric('オプション売上',yen(v.sales))+
    metric('オプション報酬',yen(v.pay))+'</div>'+
    (details.length?'<h3>月別</h3>'+periods('月',byMonth)+
      '<details><summary>日別のオプション販売</summary>'+periods('日付',byDay)+'</details>':'')+
    (items.length?'<details><summary>オプション別の内訳</summary>'+breakdown('オプション名',summarizeOptionsByName(items))+'</details>':
      empty('オプションの販売記録がありません。')));
}

function csvCell(value) {
  let text=String(value??'');
  if (typeof value==='string' && /^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(text)) text="'"+text;
  return '"'+text.replaceAll('"','""')+'"';
}
function fileDownload(name,type,body) {
  const url=URL.createObjectURL(new Blob([body],{type}));
  const anchor=document.createElement('a');
  anchor.href=url; anchor.download=name;
  document.body.appendChild(anchor); anchor.click(); anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function csvFile(name,headers,rows) {
  check(rows.length>0,'選択期間に出力できる記録がありません。');
  fileDownload(name,'text/csv;charset=utf-8','\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n');
}
function exportCsv(kind) {
  const [from,until]=bounds(), rows=rowsBetween(from,until,filter.store);
  const suffix=(sample?'サンプル_':'')+from+'_'+until+'.csv';
  const state=value=>value?.status==='work'?'出勤':value?'休日':null;
  const mode=sample?'サンプル':'実データ';
  if (kind==='daily') {
    const headers=['データ区分','日付','曜日','店舗','予定区分','予定出勤','予定退勤','予定休憩分','実績区分','実績出勤','実績退勤','実績休憩分',
      '勤務分','施術入力方式','施術分','待機分','稼働率%','施術件数','フリー件数','個人指名件数','性別指名件数','個人指名率%',
      '施術売上円','基本料金円毎60分','基本料金換算円','施設利用料率%','施設利用料円毎60分','固定材料費円毎60分','その他控除円毎60分',
      '個人指名加算円','性別指名加算円','報酬目安円','施術1時間あたり報酬円','出勤1時間あたり報酬円','店舗来店客数','出勤セラピスト人数',
      'オプション販売件数','オプション売上円','オプション追加報酬円','オプション別内訳','店舗売上円','店舗客単価円'];
    const s=data().settings, percent=n=>n===null?null:Math.round(n*10000)/100;
    csvFile('勤務データ_'+suffix,headers,rows.map(r=>{
      const v=r.totals, {plan,actual}=r;
      const options=r.visit?.mode==='detail' ? summarizeOptions(v.options) : null;
      const breakdown=options?.count ? summarizeOptionsByName(v.options).map(([name,item])=>
        name+'（'+optionLine(item)+'）').join(' ／ ') : null;
      return [mode,r.date,days[r.dow],storeName(r.store),state(plan),plan?.start,plan?.end,plan?.breaks,
        state(actual),actual?.start,actual?.end,actual?.breaks,r.work,r.visit?(r.visit.mode==='basic'?'基本':'詳細'):null,v?.minutes,r.waiting,
        v && r.work ? percent(ratio(v.minutes,r.work)):null,v?.count,v?v.count-v.personal-v.gender:null,v?.personal,v?.gender,
        v?percent(ratio(v.personal,v.count)):null,v?.sales,s.base,v?Math.round(v.minutes*s.base/60):null,
        s.feeRates[r.date.slice(0,7)],s.facility,s.material,s.other,v?v.personal*s.personal:null,v?v.gender*s.gender:null,r.pay==null?null:Math.round(r.pay),
        r.pay!=null && v?.minutes?Math.round(r.breakdown.treatmentNet*60/v.minutes):null,
        r.pay!=null && r.work?Math.round(r.breakdown.treatmentNet*60/r.work):null,r.traffic?.total,r.traffic?.staff,options?.count,options?.sales,options?.pay,breakdown,
        r.traffic?.sales,customerSpend(r.traffic)==null?null:Math.round(customerSpend(r.traffic))];
    }));
  } else {
    const headers=['データ区分','日付','曜日','店舗','時間帯','来店時刻記録のあるフリー件数','来店時刻記録のある個人指名件数',
      '来店時刻記録のある性別指名件数','店舗来店客数'];
    const out=rows.flatMap(r=>hourly([r]).bins.filter(b=>b.free+b.personal+b.gender || b.trafficCount)
      .map(b=>[mode,r.date,days[r.dow],storeName(r.store),hourLabel(b.hour),
        b.free+b.personal+b.gender?b.free:null,b.free+b.personal+b.gender?b.personal:null,b.free+b.personal+b.gender?b.gender:null,
        b.trafficCount?b.customers:null]));
    csvFile('時間帯別_'+suffix,headers,out);
  }
  notify('CSVを出力しました');
}

    return '<details class="record"><summary>'+esc(item.name)+'</summary><p class="sub">'+amounts+'</p>'+
      '<form class="optionForm stack" data-option-id="'+esc(item.id)+'">'+fields(item)+
      '<div class="row"><button type="submit">変更を保存</button><button type="button" class="danger" data-remove-option="'+esc(item.id)+'">削除</button></div></form></details>';
  }).join('')+'</div><details><summary>＋ オプションを追加</summary><form class="optionForm stack">'+fields()+
    '<button type="submit" class="primary">オプションを登録</button></form></details>'+
    '<p class="sub">変更・削除しても、保存済みの施術には記録時の名前と金額が残ります。</p>');
}
function settingsScreen() {
  const s=data().settings;
  const fieldSetting=(name,label)=>field(label,numeric(name,s[name]));
  const rates=Object.entries(s.feeRates).sort((a,b)=>b[0].localeCompare(a[0]));
  return setHeading('設定','報酬・店舗・バックアップを管理')+
    '<div class="split settings-grid">'+panel('報酬設定',
      '<form id="paySettings" class="stack"><div class="split">'+fieldSetting('base','基本料金（円／60分）')+
      fieldSetting('target','目標月間報酬（円、0は未設定）')+fieldSetting('personal','個人指名料（円／件）')+
      fieldSetting('gender','性別指名加算（円／件）')+'</div>'+
      '<fieldset><legend>時間あたりの控除（円／60分）</legend><div class="split">'+fieldSetting('facility','施設利用料')+
      fieldSetting('material','固定材料費')+fieldSetting('other','その他控除')+'</div></fieldset>'+
      '<button class="primary" type="submit">報酬設定を保存</button></form>')+
    panel('月別施設利用料率',
      '<form id="rateSettings" class="stack"><div class="split">'+field('対象月',input('targetMonth','month',settingMonth,'min="1900-01" max="2199-12" required'))+
      field('施設利用料率（%）',numeric('rate',s.feeRates[settingMonth],100,0,false,.01))+'</div>'+
      '<p class="sub" id="rateStatus">'+(s.feeRates[settingMonth]==null?'未設定':'設定済み')+' ／ 施術売上から差し引く割合</p>'+
      '<div class="row"><button class="primary" type="submit">月別施設利用料率を保存</button></div></form>'+
      (rates.length?'<details><summary>設定済みの月（'+rates.length+'件）</summary>'+table(['対象月','施設利用料率'],rates.map(([m,r])=>tr(cell(m)+ncell(r+'%'))).join(''))+'</details>':
        '<p class="sub">設定済みの月はありません。</p>'))+'</div>'+
    optionSettingsPanel(s)+panel('店舗管理','<div class="entries">'+data().stores.map(s=>'<form class="record stack storeForm" data-store-id="'+esc(s.id)+'">'+
      field('店舗名',input('storeName','text',s.name,'maxlength="30" required'))+'<div class="row"><button type="submit">名前を保存</button>'+
      '<button type="button" class="danger" data-remove-store="'+esc(s.id)+'">削除</button></div></form>').join('')+'</div>'+
      '<form id="addStore" class="stack">'+field('追加する店舗名',input('storeName','text','','maxlength="30" required placeholder="例：中央店"'))+
      '<button type="submit" class="primary">店舗を追加</button></form><p class="sub">記録のある店舗は名前を変更できます。削除する場合は先に該当店舗の記録を削除してください。</p>')+
    panel('JSONバックアップ・復元','<div class="row"><button id="backup">JSONを保存</button><button id="restore" '+(sample?'disabled':'')+'>JSONから復元</button></div>'+
      '<input type="file" id="restoreFile" accept=".json,application/json" aria-label="復元するJSON" hidden><p class="sub">'+
      (sample?'サンプルのJSONを保存できます。実データの復元は実データ画面で行います。':'復元すると現在の記録・店舗・設定を置き換えます。復元前に現在のJSONを保存しておくと戻せます。')+'</p>')+
    panel('操作ガイド',$('guide').innerHTML);
}
function backup() {
  const envelope={app:KEY,type:sample?'sample':'real',data:data()};
  fileDownload((sample?'サンプル_':'')+'勤務バックアップ_'+today+'.json','application/json;charset=utf-8',JSON.stringify(envelope,null,2));
  notify('バックアップを出力しました');
}
async function restore(file) {
  if (!file || sample) return;
  try {
    check(file.size<=15*1024*1024,'復元できるJSONは15MBまでです。');
    const envelope=JSON.parse(await file.text());
    check(envelope?.app===KEY && envelope.type==='real','この試作版の実データ用JSONを選択してください。');
    const restored=migrate(envelope.data);
    validate(restored);
    check(!sample,'実データ画面で復元してください。');
    if (!confirm('現在の実データをこのバックアップの内容で置き換えますか？')) return;
    commit(restored,true);
    calendarStore='';filter.store='';render();notify('バックアップを復元しました');
  } catch (error) { notify(error instanceof SyntaxError?'JSONを読み取れません。現在の記録は保持されています。':error.message); }
}
function submitSettings(event) {
  const form=event.target;
  if (!form.matches('#paySettings,#rateSettings,#addStore,.storeForm,.optionForm')) return;
  event.preventDefault();
  const v=fromForm(form), next=clone(data());
  try {
    if (form.id==='paySettings') {
      for (const name of ['base','personal','gender','facility','material','other','target']) next.settings[name]=Number(v[name]);
    } else if (form.id==='rateSettings') {
      check(validMonth(v.targetMonth),'対象月を入力してください。');
      if (v.rate==='') {
        if (next.settings.feeRates[v.targetMonth]!=null && !confirm('この月の施設利用料率を解除しますか？')) return;
        delete next.settings.feeRates[v.targetMonth];
      } else next.settings.feeRates[v.targetMonth]=Number(v.rate);
      settingMonth=v.targetMonth;
    } else if (form.matches('.optionForm')) {
      const optionId=form.dataset.optionId;
      const name=v.optionName.trim();
      check(name && name!==MATTRESS.name,'オプション名を確認してください。プレミアムマットレスは登録済みです。');
      const item={id:optionId??id(),name,price:Number(v.optionPrice),share:Number(v.optionPay)};
      if (optionId) {
        const index=next.settings.options.findIndex(entry=>entry.id===optionId);
        check(index>0,'変更できるオプションを確認してください。');
        next.settings.options[index]=item;
      } else next.settings.options.push(item);
    } else if (form.id==='addStore') {
      next.stores.push({id:id(),name:v.storeName.trim()});
    } else next.stores.find(s=>s.id===form.dataset.storeId).name=v.storeName.trim();
    commit(next);render();notify('保存しました');
  } catch (error) { notify(error.message); }
}
function removeOption(optionId) {
  const next=clone(data());
  const index=next.settings.options.findIndex(item=>item.id===optionId);
  if (index<1 || !confirm('「'+next.settings.options[index].name+'」を選択肢から削除しますか？')) return;
  try {
    next.settings.options.splice(index,1);
    commit(next);render();notify('オプションを削除しました');
  } catch (error) { notify(error.message); }
}
function removeStore(storeId) {
  try {
    const next=clone(data());
    check(next.stores.length>1,'店舗は1件以上必要です。');
    check(![next.shifts,next.visits,next.traffic].some(map=>Object.values(map).some(r=>r.store===storeId)),'記録がある店舗は削除できません。');
    if (!confirm('店舗「'+storeName(storeId)+'」を削除しますか？')) return;
    next.stores=next.stores.filter(s=>s.id!==storeId);
    commit(next);
    if (calendarStore===storeId) calendarStore='';
    if (filter.store===storeId) filter.store='';
    render();notify('店舗を削除しました');
  } catch (error) { notify(error.message); }
}
function render() {
  for (const button of document.querySelectorAll('[data-nav]')) {
    if (button.dataset.nav===tab) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
  $('sampleToggle').textContent=sample?'実データに戻る':'サンプルを試す';
  $('modeBanner').hidden=!sample;
  $('modeBanner').innerHTML=sample?'<strong>サンプル表示中</strong>　架空の記録です。変更はこの画面を開いている間だけ保持します。':'';
  $('modeBanner').style.marginBottom=sample?'12px':'';
  $('app').innerHTML=({calendar,analysis,export:exportScreen,settings:settingsScreen})[tab]();
  $('storageStatus').classList.toggle('error',!!storageProblem && !sample);
  $('storageStatus').textContent=sample?'サンプルモード':storageProblem||'実データはこのブラウザ内に保存されます。';
}
let realView=null;
$('sampleToggle').addEventListener('click',()=>{
  if (!sample) {
    demo=buildDemo();validate(demo);
    realView={month,selectedDay,calendarStore,filter:{...filter},settingMonth};
    const m=today.slice(0,7);
    month=m;selectedDay=today;calendarStore='';settingMonth=m;
    filter={kind:'month',anchor:today,start:m+'-01',end:monthEnd(m),store:''};
    sample=true;tab='analysis';
  } else {
    ({month,selectedDay,calendarStore,filter,settingMonth}=realView);
    sample=false;demo=null;
  }
  render();$('app').querySelector('h2')?.focus();
});
document.querySelector('nav').addEventListener('click',event=>{
  const button=event.target.closest('[data-nav]');
  if (!button) return;
  tab=button.dataset.nav;render();window.scrollTo(0,0);$('app').querySelector('h2')?.focus();
});
$('app').addEventListener('click',event=>{
  const button=event.target.closest('button');
  if (!button || button.type==='submit' && button.form) return;
  const d=button.dataset;
  if (d.analysisView) {
    if (analysisView===d.analysisView) return;
    analysisView=d.analysisView;
    render();
    $('app').querySelector('[aria-pressed="true"]').focus({preventScroll:true});
  } else if (d.day) {
    selectedDay=d.day;render();
    const focus=$('selectedDayTitle');
    if (matchMedia('(max-width: 760px)').matches) { focus.scrollIntoView({block:'start'});focus.focus({preventScroll:true}); }
    else $('app').querySelector('[data-day="'+selectedDay+'"]').focus();
  } else if (d.month) {
    const next=d.month==='today'?today.slice(0,7):monthOffset(month,Number(d.month));
    if (!validMonth(next)) return;
    month=next;selectedDay=d.month==='today'?today:month+'-01';render();
    $('app').querySelector('[data-month="'+d.month+'"]').focus();
  } else if (d.edit) openEditor(d.edit,d.store,d.layer);
  else if (d.csv) { try { exportCsv(d.csv); } catch (error) { notify(error.message); } }
  else if (d.removeStore) removeStore(d.removeStore);
  else if (d.removeOption) removeOption(d.removeOption);
  else if (button.id==='backup') backup();
  else if (button.id==='restore') $('restoreFile').click();
});
$('app').addEventListener('submit',submitSettings);
$('app').addEventListener('change',event=>{
  const {name,value,id}=event.target;
  if (id==='restoreFile') { restore(event.target.files[0]);event.target.value='';return; }
  if (name==='calendarStore') calendarStore=value;
  else if (name==='filterStore') filter.store=value;
  else if (name==='period') {
    if (value==='custom') [filter.start,filter.end]=bounds();
    filter.kind=value;
  } else if (name==='anchor' || name==='filterStart' || name==='filterEnd') {
    if (!validDate(value)) { notify('有効な日付を選択してください。');render();return; }
    if (name==='anchor') filter.anchor=value;
    if (name==='filterStart') { filter.start=value;if(value>filter.end) filter.end=value; }
    if (name==='filterEnd') { filter.end=value;if(value<filter.start) filter.start=value; }
  } else if (name==='targetMonth') {
    if (!validMonth(value)) return;
    settingMonth=value;
    const rate=data().settings.feeRates[value];
    event.target.form.elements.rate.value=rate??'';
    $('rateStatus').textContent=(rate==null?'未設定':'設定済み')+' ／ 施術売上から差し引く割合';
    return;
  } else return;
  const scroll=window.scrollY;
  render();
  $('app').querySelector('[name="'+name+'"]')?.focus({preventScroll:true});
  window.scrollTo(0,scroll);
});
$('editorForm').addEventListener('submit',saveEditor);
$('closeEditor').addEventListener('click',()=> $('editor').close());
$('editor').addEventListener('close',()=>{editing=null;});
$('deleteRecord').addEventListener('click',removeRecord);
function addDetail() {
  const box=$('detailRows');
  if (box.children.length>=250) {showFormError('詳細は最大250件です。');return;}
  box.insertAdjacentHTML('beforeend',detailRow({minutes:'',sales:'',kind:'free',time:'',memo:''},box.children.length));
  box.lastElementChild.querySelector('input').focus();
}
$('editorBody').addEventListener('click',event=>{
  if (event.target.id==='addDetail') addDetail();
  if (event.target.closest('[data-remove-detail]')) {
    event.target.closest('.detail-entry').remove();
    [...$('detailRows').children].forEach((child,i)=>{
      child.querySelector('strong').textContent='施術 '+(i+1);
      child.querySelector('[data-remove-detail]').setAttribute('aria-label','施術 '+(i+1)+' を外す');
    });
    $('addDetail').focus();
  }
});
$('editorBody').addEventListener('input',event=>{
  const field=event.target;
  if (!field.hasAttribute('data-clock')) return;
  const digits=value=>value.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-0xff10)).replace(/[^0-9]/g,'');
  const cursor=digits(field.value.slice(0,field.selectionStart)).length;
  const value=digits(field.value);
  const formatted=value.length===4 ? value.slice(0,2)+':'+value.slice(2) : value;
  if (formatted!==field.value) {
    field.value=formatted;
    const position=cursor+(value.length===4 && cursor>2 ? 1 : 0);
    field.setSelectionRange(position,position);
  }
  field.setCustomValidity(!value || clockOK(formatted) ? '' : '時刻は0000〜2359の範囲で、分が00〜59となる4桁を入力してください。');
});
$('editorBody').addEventListener('change',event=>{
  const {name,value}=event.target;
  const visible=(target,show)=>{ const el=$(target);el.hidden=!show;el.disabled=!show; };
  if (name==='status') visible('workFields',value==='work');
  if (name==='mode') {
    visible('basicFields',value==='basic');
    visible('detailFields',value==='detail');
    if (value==='detail' && !$('detailRows').children.length) addDetail();
  }
});
render();
</script>
</body>
